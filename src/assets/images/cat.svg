<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Cat Body -->
  <ellipse cx="100" cy="140" rx="40" ry="50" fill="#FFA500" stroke="#FF8C00" stroke-width="2"/>
  
  <!-- Cat Head -->
  <circle cx="100" cy="80" r="35" fill="#FFA500" stroke="#FF8C00" stroke-width="2"/>
  
  <!-- Ears -->
  <path d="M 70 65 L 65 45 L 80 55 Z" fill="#FFA500" stroke="#FF8C00" stroke-width="2"/>
  <path d="M 130 65 L 135 45 L 120 55 Z" fill="#FFA500" stroke="#FF8C00" stroke-width="2"/>
  
  <!-- Inner Ears -->
  <path d="M 72 58 L 70 50 L 76 54 Z" fill="#FFB6C1"/>
  <path d="M 128 58 L 130 50 L 124 54 Z" fill="#FFB6C1"/>
  
  <!-- Eyes -->
  <ellipse cx="85" cy="75" rx="8" ry="12" fill="#000000"/>
  <ellipse cx="115" cy="75" rx="8" ry="12" fill="#000000"/>
  
  <!-- Eye Shine -->
  <circle cx="87" cy="72" r="3" fill="#FFFFFF"/>
  <circle cx="117" cy="72" r="3" fill="#FFFFFF"/>
  
  <!-- Nose -->
  <path d="M 100 85 L 95 90 L 100 93 L 105 90 Z" fill="#FF1493"/>
  
  <!-- Mouth -->
  <path d="M 100 93 Q 90 98 85 93" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <path d="M 100 93 Q 110 98 115 93" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Whiskers -->
  <line x1="50" y1="80" x2="20" y2="75" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="50" y1="85" x2="20" y2="85" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="150" y1="80" x2="180" y2="75" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="150" y1="85" x2="180" y2="85" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Front Paws -->
  <ellipse cx="80" cy="170" rx="15" ry="20" fill="#FFA500" stroke="#FF8C00" stroke-width="2"/>
  <ellipse cx="120" cy="170" rx="15" ry="20" fill="#FFA500" stroke="#FF8C00" stroke-width="2"/>
  
  <!-- Paw Pads -->
  <ellipse cx="80" cy="180" rx="8" ry="5" fill="#FF1493"/>
  <ellipse cx="120" cy="180" rx="8" ry="5" fill="#FF1493"/>
  
  <!-- Tail -->
  <path d="M 135 140 Q 170 120 180 80" fill="none" stroke="#FFA500" stroke-width="20" stroke-linecap="round"/>
  <path d="M 135 140 Q 170 120 180 80" fill="none" stroke="#FF8C00" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Belly Pattern -->
  <ellipse cx="100" cy="140" rx="20" ry="30" fill="#FFDAB9" opacity="0.7"/>
</svg>